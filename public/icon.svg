<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="0.8" y2="0.8">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- Clover Board Center Accent -->
  <g filter="url(#shadow)" transform="translate(256,256)">
    <!-- 4 Leaves -->
    <!-- Top-Left Leaf -->
    <path d="M 0 0 C -60 -40 -120 -10 -120 -80 C -120 -140 -60 -160 0 -90 Z" fill="url(#leafGrad)" transform="rotate(0)"/>
    <!-- Top-Right Leaf -->
    <path d="M 0 0 C -60 -40 -120 -10 -120 -80 C -120 -140 -60 -160 0 -90 Z" fill="url(#leafGrad)" transform="rotate(90)"/>
    <!-- Bottom-Right Leaf -->
    <path d="M 0 0 C -60 -40 -120 -10 -120 -80 C -120 -140 -60 -160 0 -90 Z" fill="url(#leafGrad)" transform="rotate(180)"/>
    <!-- Bottom-Left Leaf -->
    <path d="M 0 0 C -60 -40 -120 -10 -120 -80 C -120 -140 -60 -160 0 -90 Z" fill="url(#leafGrad)" transform="rotate(270)"/>

    <!-- Central stem / center dot -->
    <circle cx="0" cy="0" r="28" fill="#15803d"/>
    <circle cx="0" cy="0" r="14" fill="#bbf7d0"/>

    <!-- 4 Cards representation in center -->
    <rect x="-85" y="-85" width="75" height="75" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="4" opacity="0.95"/>
    <rect x="10" y="-85" width="75" height="75" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="4" opacity="0.95"/>
    <rect x="-85" y="10" width="75" height="75" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="4" opacity="0.95"/>
    <rect x="10" y="10" width="75" height="75" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="4" opacity="0.95"/>

    <!-- Card line details -->
    <line x1="-70" y1="-47" x2="-25" y2="-47" stroke="#15803d" stroke-width="4" stroke-linecap="round"/>
    <line x1="25" y1="-47" x2="70" y2="-47" stroke="#15803d" stroke-width="4" stroke-linecap="round"/>
    <line x1="-70" y1="47" x2="-25" y2="47" stroke="#15803d" stroke-width="4" stroke-linecap="round"/>
    <line x1="25" y1="47" x2="70" y2="47" stroke="#15803d" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
